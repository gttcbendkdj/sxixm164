<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纯前端验证码邮件监控工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 8px;
            text-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
        }

        .header p {
            color: #e0e0e0;
            font-size: 14px;
        }

        .config-form {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(90deg, #00cccc, #0099cc);
            color: white;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .btn:hover {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .loading {
            text-align: center;
            color: #00ffff;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .result-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 20px;
            color: white;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-header h3 {
            color: #00ffff;
        }

        .status {
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-success {
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
        }

        .status-error {
            background: rgba(255, 0, 0, 0.1);
            color: #ff4444;
        }

        .result-content {
            max-height: 300px;
            overflow-y: auto;
        }

        .code-item {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
        }

        .code-item .title {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 5px;
        }

        .code-item .value {
            font-size: 18px;
            font-weight: 600;
            color: #00ffff;
        }

        .empty-tip {
            text-align: center;
            color: #999999;
            padding: 20px;
        }

        .tip {
            font-size: 12px;
            color: #cccccc;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <div class="header">
            <h1>纯前端验证码邮件监控工具</h1>
            <p>客户端直连邮箱，数据不上传，隐私更安全</p>
        </div>

        <div class="config-form">
            <div class="form-group">
                <label for="imap-server">IMAP 服务器</label>
                <input type="text" id="imap-server" placeholder="Zoho填imap.zoho.com，QQ填imap.qq.com" value="imap.zoho.com">
            </div>
            <div class="form-group">
                <label for="email-username">邮箱账号</label>
                <input type="text" id="email-username" placeholder="你的完整邮箱地址">
            </div>
            <div class="form-group">
                <label for="email-password">IMAP 授权码</label>
                <input type="password" id="email-password" placeholder="非登录密码，需在邮箱设置中生成">
            </div>
            <div class="form-group">
                <label for="pattern">验证码匹配规则</label>
                <input type="text" id="pattern" placeholder="例如 FB-(\\d+) 匹配FB-123456" value="FB-(\\d+)">
            </div>
        </div>

        <button class="btn" onclick="checkEmail()" id="check-btn">立即检测验证码</button>
        <div class="loading" id="loading">正在连接邮箱并检测，请稍候...</div>

        <div class="result-section">
            <div class="result-header">
                <h3>检测结果</h3>
                <span class="status" id="status">未检测</span>
            </div>
            <div class="result-content" id="result-content">
                <div class="empty-tip">暂无检测结果，请填写配置后点击检测</div>
            </div>
        </div>

        <div class="tip">
            提示：1. 需开启邮箱IMAP服务 2. 授权码非登录密码 3. 仅在本地运行，数据不泄露
        </div>
    </div>

    <!-- 修复依赖加载顺序：先加载 buffer，再加载 imap/mailparser -->
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
    <script>
        // 全局暴露 Buffer，解决 imap.js 依赖问题
        window.Buffer = window.Buffer || Buffer;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/imap@0.8.19/lib/imap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mailparser@3.6.5/lib/mailparser.min.js"></script>

    <script>
        async function checkEmail() {
            const server = document.getElementById('imap-server').value.trim();
            const username = document.getElementById('email-username').value.trim();
            const password = document.getElementById('email-password').value.trim();
            const pattern = document.getElementById('pattern').value.trim();
            const btn = document.getElementById('check-btn');
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');
            const resultContent = document.getElementById('result-content');

            // 校验参数
            if (!server || !username || !password || !pattern) {
                alert('请填写完整配置信息！');
                return;
            }

            // 状态切换
            btn.disabled = true;
            loading.style.display = 'block';
            status.className = 'status';
            status.textContent = '检测中';
            resultContent.innerHTML = '<div class="empty-tip">正在解析未读邮件...</div>';

            try {
                // 配置 IMAP 连接
                const imap = new Imap({
                    user: username,
                    password: password,
                    host: server,
                    port: 993,
                    tls: true,
                    tlsOptions: { rejectUnauthorized: false }
                });

                // 解析邮件并提取验证码
                const codeList = await new Promise((resolve, reject) => {
                    const codes = [];
                    imap.once('ready', () => {
                        imap.openBox('INBOX', false, (err, box) => {
                            if (err) reject(err);
                            // 搜索未读邮件
                            imap.search(['UNSEEN'], (err, results) => {
                                if (err) reject(err);
                                if (results.length === 0) {
                                    imap.end();
                                    resolve([]);
                                    return;
                                }

                                // 抓取邮件内容
                                const f = imap.fetch(results, { bodies: ['HEADER.FIELDS (SUBJECT)'] });
                                f.on('message', (msg) => {
                                    msg.on('body', (stream) => {
                                        let buffer = '';
                                        stream.on('data', (chunk) => buffer += chunk.toString());
                                        stream.on('end', () => {
                                            const header = Imap.parseHeader(buffer);
                                            const subject = header.subject ? header.subject[0] : '';
                                            const match = subject.match(new RegExp(pattern));
                                            if (match && match[1]) {
                                                codes.push({
                                                    code: match[1],
                                                    time: new Date().toLocaleString(),
                                                    email: username
                                                });
                                            }
                                        });
                                    });
                                });

                                f.once('end', () => {
                                    imap.end();
                                    resolve(codes);
                                });
                            });
                        });
                    });

                    imap.once('error', (err) => reject(err));
                    imap.once('end', () => console.log('IMAP 连接已关闭'));
                    imap.connect();
                });

                // 渲染结果
                if (codeList.length > 0) {
                    status.className = 'status status-success';
                    status.textContent = '检测成功';
                    let html = '';
                    codeList.forEach(item => {
                        html += `
                            <div class="code-item">
                                <div class="title">收件邮箱: ${item.email} | 时间: ${item.time}</div>
                                <div class="value">验证码: ${item.code}</div>
                            </div>
                        `;
                    });
                    resultContent.innerHTML = html;
                } else {
                    status.className = 'status status-success';
                    status.textContent = '无新验证码';
                    resultContent.innerHTML = '<div class="empty-tip">未找到匹配的验证码邮件</div>';
                }
            } catch (error) {
                // 错误处理
                status.className = 'status status-error';
                status.textContent = '检测失败';
                resultContent.innerHTML = `<div class="empty-tip">❌ 错误信息：${error.message}</div>`;
                console.error('IMAP 错误:', error);
            } finally {
                // 恢复状态
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
